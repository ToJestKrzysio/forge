services:

  api:
    build:
      context: .
    env_file:
      - ./envs/postgres.env
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
#    healthcheck:
#      test: curl --fail http://localhost:8000/ || exit 1
#      interval: 60s
#      timeout: 10s
#      retries: 3
#      start_period: 20s


  postgres:
    image: postgres:17
    env_file:
      - ./envs/postgres.env
    volumes:
#      - ./data/postgres/:/var/lib/postgresql/data
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"


volumes:
  postgres_data: